name: QA

on: pull_request

concurrency:
  group: qa-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (${{ matrix.image-tag }}, ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        version: [ '3.11', '3.12', '3.13', '3.14' ]
        image-tag: [ latest, preview ]

    steps:
    - name: Clone repository
      uses: actions/checkout@v7.0.1
    - name: Use Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.version }}
    - name: Install dependencies
      run: |
        curl --location --silent --show-error --fail https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        uv sync --dev
    - name: Run QA
      run: make qa
      env:
        EVENTSOURCINGDB_IMAGE_TAG: ${{ matrix.image-tag }}
